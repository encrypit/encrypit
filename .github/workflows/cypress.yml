name: cypress
on: [push, pull_request]

permissions:
  contents: read

jobs:
  cypress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Set compatibility date
        id: compatibility_date
        run: echo "date=$(date -d "yesterday" +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          browser: chrome
          start: |
            npx vite --host
            npx wrangler pages dev . --r2=EXPIRATION_DAYS_7 --compatibility-date=${{ steps.compatibility_date.outputs.date }}
          wait-on: 'http://localhost:5173, http://localhost:8788'

      - name: Record failed screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      - name: Record videos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-videos
          path: cypress/videos
